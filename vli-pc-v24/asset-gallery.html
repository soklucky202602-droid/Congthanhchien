<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thư viện tài nguyên UI PC từ PAK</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0b110c;color:#eddbad;font:12px Tahoma,Arial}header{position:sticky;top:0;z-index:5;background:#0b110cf6;border-bottom:1px solid #9c855a;padding:13px 18px}h1{font-size:19px;margin:0 0 7px}.hint{color:#cfbd8f;font-size:12px}.controls{display:flex;gap:10px;flex-wrap:wrap;padding-top:9px;align-items:center}.controls input,.controls select{padding:8px;color:#eee5c9;background:#172219;border:1px solid #8b7958;border-radius:0;min-width:220px}.controls button{background:#27331e;color:#f8e9b8;border:1px solid #8e7b54;padding:7px 13px;cursor:pointer}main{padding:18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}.asset{background:#101c13;border:1px solid #5c593e;box-shadow:0 4px 8px #0005;min-height:170px;padding:8px;cursor:pointer;color:#f2dab0;display:flex;flex-direction:column;gap:4px}.asset:hover{border-color:#dfc280}.asset .box{display:flex;align-items:center;justify-content:center;height:122px;background:#26362a;background-image:linear-gradient(45deg,#39473844 25%,transparent 25%,transparent 75%,#39473844 75%),linear-gradient(45deg,#39473844 25%,transparent 25%,transparent 75%,#39473844 75%);background-size:16px 16px;background-position:0 0,8px 8px;overflow:hidden}.asset img{display:block;max-width:100%;max-height:100%;object-fit:contain}.asset b{color:#eddbad;font-size:12px}.asset small{color:#c0af8c;font-size:10px}dialog{max-width:min(900px,95vw);width:fit-content;border:14px solid transparent;border-image:url('assets/pc-v22/pc-frame-nine-slice.webp') 24 fill/14px stretch;background:#101a13;color:#f8de9e;box-shadow:0 10px 30px #000c}dialog::backdrop{background:#000b}.viewer{display:flex;flex-direction:column;gap:8px;align-items:center}.viewer img{max-width:min(830px,85vw);max-height:70vh;object-fit:contain;background:#273827}.viewer button{padding:8px 21px;background:#20371f;color:#eedbad;border:1px solid #a58e5b}.empty{text-align:center;padding:45px;color:#dcbf86;font-size:16px}a{color:#e8d19a}</style></head><body>
<header><h1>Thư viện tài nguyên giao diện PC</h1><div class="hint">135 mục Ui.pak gốc (133 SPR hiển thị frame đầu, 2 JPG) + 98 ảnh PC đã trích trong V21/V22. Ảnh gốc chưa chứng nhận đã bao trùm toàn bộ client PC.</div>
<div class="controls"><input id="search" type="search" placeholder="Tìm hash, loại tài nguyên..." aria-label="Tìm tài nguyên"><select id="filter" aria-label="Lọc nguồn"><option value="all">Tất cả tài nguyên</option><option value="uipak">Ui.pak gốc (135)</option><option value="v21">V21 – 75 ảnh PC</option><option value="v22">V22 – 23 ảnh PC</option></select><button onclick="location.href='index.html'">Quay lại giao diện H5</button><span id="count"></span></div></header>
<main id="list"></main><dialog id="viewer"><div class="viewer"><b id="viewTitle"></b><img id="viewImage" alt="Ảnh tài nguyên PC đã chọn"><div id="viewInfo"></div><button id="viewClose">Đóng</button></div></dialog>
<script>
(async()=>{
  const obj=await(await fetch('assets/ui-pak/manifest.json')).json();
  const base=obj.filter(x=>x.file).map(x=>({name:x.hash+'.'+x.kind,source:'uipak',file:'assets/ui-pak/'+x.file,size:(x.width||'?')+'×'+(x.height||'?'),frames:x.frames||1,hash:x.hash}));
  const manifest=await(await fetch('assets/manifest.json')).json();
  const extra=[];for(const src of ['v21','v22']){
    const count=src==='v21'?manifest.v21_assets:manifest.v22_assets;
    for(const x of count)extra.push({name:x,source:src,file:'assets/pc-'+src+'/'+x,size:'Sprite PC',frames:1});
  }
  const items=base.concat(extra),list=document.getElementById('list'),count=document.getElementById('count');
  const search=document.getElementById('search'),filter=document.getElementById('filter');
  function draw(){list.replaceChildren();const q=search.value.toLowerCase();const source=filter.value;
    const selected=items.filter(x=>(source==='all'||x.source===source)&&(x.name.toLowerCase().includes(q)||x.source.includes(q)||x.hash?.toLowerCase().includes(q)));
    const frag=document.createDocumentFragment();for(const x of selected){const btn=document.createElement('button');btn.className='asset';btn.type='button';
      const thumb=document.createElement('div');thumb.className='box';const img=document.createElement('img');img.loading='lazy';img.alt=x.name;img.src=x.file;thumb.append(img);
      const b=document.createElement('b');b.textContent=x.name;const small=document.createElement('small');small.textContent=x.source.toUpperCase()+' • '+x.size+' • '+x.frames+' frame';btn.append(thumb,b,small);
      btn.addEventListener('click',()=>{document.getElementById('viewTitle').textContent=x.name;document.getElementById('viewImage').src=x.file;document.getElementById('viewInfo').textContent=x.source+' | '+x.size+' | '+x.frames+' frame(s)';document.getElementById('viewer').showModal();});frag.append(btn);}
    list.append(frag);count.textContent=selected.length+' tài nguyên';if(!selected.length)list.innerHTML='<div class="empty">Không tìm thấy tài nguyên phù hợp</div>';}
  search.addEventListener('input',draw);filter.addEventListener('change',draw);document.getElementById('viewClose').addEventListener('click',()=>document.getElementById('viewer').close());draw();
})().catch(err=>{document.getElementById('list').textContent='Lỗi nạp danh mục: '+err.message+'. Hãy chạy qua START_PC_UI_ONLY.cmd.';});
</script></body></html>
