<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADMV · Hệ số Server</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0e0d;color:#eee4cb;font:14px system-ui,-apple-system,Segoe UI,sans-serif}.shell{max-width:1100px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #403d32;padding-bottom:16px;margin-bottom:18px}.brand{font-size:28px;font-weight:900;letter-spacing:3px}.sub,.muted{color:#9c998d;font-size:12px}.card{background:#141816;border:1px solid #3c3a31;border-radius:10px;padding:18px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.item{background:#101310;border:1px solid #34352e;border-radius:8px;padding:15px}.item b{display:block;font-size:16px}.item small{display:block;color:#929991;margin:5px 0 10px}.row{display:flex;gap:8px;align-items:center}.row input{flex:1;background:#090c0b;border:1px solid #555044;color:#f2ead5;padding:10px;border-radius:6px;font-size:16px}.x{color:#d9c77e;font-weight:800}.btn{border:1px solid #625b46;background:#24251f;color:#eee4cb;border-radius:6px;padding:10px 14px;cursor:pointer}.primary{background:#78652d;border-color:#ad9140;font-weight:700}.danger{border-color:#7a4038;color:#f0a29a}.actions{display:flex;gap:8px;flex-wrap:wrap}.status{padding:11px;background:#0b0f0d;border:1px solid #303630;color:#9fa69f;margin-top:14px}.note{padding:12px;border:1px solid #66552a;color:#e3d39b;background:#201d14;margin-bottom:16px}.footer{color:#666e66;font-size:11px;margin-top:18px}@media(max-width:700px){.grid{grid-template-columns:1fr}.shell{padding:12px}}</style></head><body><div class="shell"><header class="top"><div><div class="brand">ADMV</div><div class="sub">HỆ SỐ SERVER · VÕ LÂM IDLE</div></div><a class="btn" href="./">← Về ADMV</a></header><div class="note"><b>Hệ số gameplay toàn server</b><br>Áp dụng cho bản Offline hiện tại. Cấu hình được lưu ở <code>localStorage:jxidle_server_cfg</code> và game đọc ngay khi khởi động.</div><section class="card"><div class="grid" id="grid"></div><div class="actions"><button class="btn primary" id="apply">LƯU HỆ SỐ</button><button class="btn" id="defaults">KHÔI PHỤC MẶC ĐỊNH ×1</button><a class="btn" href="../">MỞ GAME</a></div><div class="status" id="status">Đang đọc cấu hình...</div></section><div class="footer">Không sửa save nhân vật. Hệ số là cấu hình gameplay riêng.</div></div><script>'use strict';const D={xp:1,gold:1,knb:1,drop:1,hkDrop:1,material:1,playerDamage:1,monsterDamage:1,monsterHp:1,monsterSpeed:1,gameSpeed:1};const LABEL={xp:['Kinh nghiệm','EXP nhận được'],gold:['Vàng / Ngân lượng','Tiền rơi từ quái và offline'],knb:['Kim Nguyên Bảo','KNB từ các phần thưởng'],drop:['Tỷ lệ rơi đồ','Trang bị thường / xanh / tím'],hkDrop:['Tỷ lệ rơi Hoàng Kim','Xác suất Hoàng Kim'],material:['Tỷ lệ nguyên liệu','Huyền Tinh / vật liệu'],playerDamage:['Sát thương nhân vật','Damage gây lên quái'],monsterDamage:['Sát thương quái','Damage quái gây lên nhân vật'],monsterHp:['HP quái','Máu quái'],monsterSpeed:['Tốc độ quái','Di chuyển + nhịp AI'],gameSpeed:['Tốc độ game','Toàn bộ nhịp combat']};const $=id=>document.getElementById(id),cfg=()=>{try{return Object.assign({},D,JSON.parse(localStorage.getItem('jxidle_server_cfg')||'{}'))}catch{return Object.assign({},D)}};function render(){const c=cfg();$('grid').innerHTML=Object.keys(D).map(k=>`<div class="item"><b>${LABEL[k][0]}</b><small>${LABEL[k][1]}</small><div class="row"><input id="v_${k}" type="number" min="0.05" max="100" step="0.05" value="${Number(c[k]||1)}"><span class="x">×</span></div></div>`).join('')}function save(){const c={};for(const k of Object.keys(D)){let v=Number($('v_'+k).value);if(!Number.isFinite(v))v=1;c[k]=Math.max(.05,Math.min(100,v))}localStorage.setItem('jxidle_server_cfg',JSON.stringify(c));$('status').textContent='Đã lưu hệ số. Hãy tải lại game để áp dụng đầy đủ.'}function reset(){localStorage.setItem('jxidle_server_cfg',JSON.stringify(D));render();$('status').textContent='Đã khôi phục toàn bộ về ×1.'}$('apply').onclick=save;$('defaults').onclick=reset;render();</script></body></html>
